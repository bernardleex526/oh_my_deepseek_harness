name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The deep-check scripts (validate/smoke/tests) resolve the DSH checkout
      # from $DSH_CHECKOUT. Point it at the devDependency install under
      # node_modules/@deepseek-ai so they can deep-check the real packages.
      DSH_CHECKOUT: ${{ github.workspace }}/node_modules/@deepseek-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install devDependencies
        run: npm ci

      # Build the preset from src/ + prompts/ in dist mode (never reads the
      # gitignored model-routing.json).
      - name: Build preset
        run: npm run build

      # Reproducibility gate: the committed preset must be byte-identical to a
      # fresh dist build. Use core.autocrlf=false so the LF/CRLF working-tree
      # checkout on Windows cannot cause a spurious diff.
      - name: Verify preset is reproducible
        shell: bash
        run: git -c core.autocrlf=false diff --exit-code -- preset/

      - name: Validate composition (deep package checks)
        run: npm run validate

      - name: Smoke-mount the preset in the real harness
        run: npm run smoke

      - name: Run test suite
        run: npm test
